<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tower.css">
</head>
<body class="tower-page">
  <div class="sky" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="clouds" id="clouds"></div>
  </div>

  <header class="tower-top">
    <a class="btn" href="index.html">&larr; Team select</a>
    <h1>Battle Tower</h1>
    <button type="button" class="btn" id="musicBtn" aria-pressed="true">&#9835; Music on</button>
  </header>

  <main class="tower-scene" id="scene">
    <div class="tower-wrap">
      <div class="tower" id="tower">
        <div class="beams" aria-hidden="true"></div>
        <div class="beacon" id="beacon"><span></span></div>
        <div class="roof" id="roof"></div>
        <div class="floors" id="floors"></div>
        <div class="tower-base"><div class="door"></div></div>
      </div>
      <div class="hill" aria-hidden="true"></div>
      <div class="climbers" id="climbers"></div>
    </div>

    <aside class="floor-card" id="card">
      <p class="card-kicker" id="cardKicker">Next challenge</p>
      <h2 id="cardTitle">Floor I · The Gate</h2>
      <p class="card-trainer" id="cardTrainer"></p>
      <div class="pips" id="pips"></div>
      <dl class="card-facts">
        <div><dt>Difficulty</dt><dd class="card-stars" id="cardStars"></dd></div>
        <div><dt>Foe strength</dt><dd id="cardBst"></dd></div>
      </dl>
      <div class="card-team" id="cardTeam"></div>
      <button type="button" class="btn primary block" id="enterBtn">Enter floor</button>
      <button type="button" class="btn block" id="resetBtn">Restart climb</button>
      <p class="card-best" id="cardBest"></p>
    </aside>
  </main>

  <div class="tower-banner" id="banner" hidden>
    <div class="banner-card">
      <h2>Tower conquered!</h2>
      <p>Your team stands at the summit.</p>
      <div class="banner-actions">
        <button type="button" class="btn primary" id="againBtn">Climb again</button>
        <a class="btn" href="index.html">Team select</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
  <div class="tower-flash" id="flash"></div>

  <div class="pad-legend" aria-hidden="true">
    <span><i class="pad-btn a">A</i> Enter floor</span>
    <span><i class="pad-btn b">B</i> Team select</span>
    <span><i class="pad-btn">Select</i> Music</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/music.js"></script>
  <script src="js/gamepad.js"></script>
  <script src="js/tower-data.js"></script>
  <script src="js/tower.js"></script>
</body>
</html>
