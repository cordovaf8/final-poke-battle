<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Poké Battle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body class="menu-page">
  <div class="mn-motes" id="motes" aria-hidden="true"></div>

  <header class="mn-top">
    <button type="button" class="btn" id="musicBtn" aria-pressed="true">&#9835; Music on</button>
  </header>

  <main class="mn-main">
    <div class="mn-title">
      <h1>Final Poké Battle</h1>
      <p>Choose a game mode, then build your team</p>
    </div>
    <div class="mn-team" id="lastTeam" aria-label="Your last team"></div>
    <section class="mn-modes" id="modes" aria-label="Game modes"></section>
  </main>

  <div class="mn-flash" id="flash"></div>

  <div class="pad-legend" aria-hidden="true">
    <span><i class="pad-btn">D-pad</i> Move</span>
    <span><i class="pad-btn a">A</i> Choose</span>
    <span><i class="pad-btn">Select</i> Music</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/music.js"></script>
  <script src="js/gamepad.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/tower-data.js"></script>
  <script src="js/rogue-data.js"></script>
  <script src="js/adventure-data.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
